name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.repository.private == false &&
      vars.PUBLIC_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the clean public tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: false
      - name: Install the hash-pinned dependency
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run unit and acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Verify bundled NASA references
        run: python write-verifiable-requirements/scripts/manage_references.py status
      - name: Test a fresh agent installation
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          python scripts/install_skill.py
          python scripts/install_skill.py

  nasa-authority:
    if: >-
      github.event.repository.private == false &&
      vars.PUBLIC_CI_ENABLED == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the clean public tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: false
      - name: Check current NPR authority
        run: >-
          python
          write-verifiable-requirements/scripts/manage_references.py
          check-current
